[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/checkout"
  to = "/.netlify/functions/checkout"
  status = 302

[[redirects]]
  from = "/finalize"
  to = "/.netlify/functions/finalize"
  status = 200

[[redirects]]
  from = "/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/license"
  to = "/.netlify/functions/license"
  status = 200

[[redirects]]
  from = "/download/*"
  to = "/.netlify/functions/download/:splat"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/catalog/*"
  to = "/.netlify/functions/catalog/:splat"
  status = 200

[[redirects]]
  from = "/fourthwall-webhook"
  to = "/.netlify/functions/fourthwall-webhook"
  status = 200

[[headers]]
  for = "/catalog"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/catalog/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/JS505"
  to = "/js505"
  status = 301

[[redirects]]
  from = "/JS-505"
  to = "/js505"
  status = 301

[[redirects]]
  from = "/js-505"
  to = "/js505"
  status = 301

[[redirects]]
  from = "/JS2"
  to = "/js2"
  status = 301

[[redirects]]
  from = "/JS-2"
  to = "/js2"
  status = 301

[[redirects]]
